<!doctype html>
<html lang="en" id="html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Devlog</title>
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
  </head>
  <body>
    <div id="header" class="explore-header">
      <h1>Explore</h1>
      <div class="display-switch-container">
        <button
          id="display-switch-shop"
          class="display-switch-selected"
          onclick="switchMode('shop')"
        >
          Shop
        </button>
        <button
          id="display-switch-users"
          class=""
          onclick="switchMode('user-explore')"
        >
          Users
        </button>
        <button
          id="display-switch-projects"
          class=""
          onclick="switchMode('project-explore')"
        >
          Projects
        </button>
      </div>
    </div>

    <div id="shop" class="explore-box">
      <div class="cookie-display">
        <p id="cookie-display">Current Balance: 100🍪</p>
      </div>
      <div class="goal-toggle">
        <button onclick="toggleGoals()">Toggle goals</button>
      </div>
      <div id="goals" class="shop-item-box goals-grid"></div>
      <div>
        <div class="explore-input-box">
          <div class="explore-query-row">
            <div class="explore-input-with-clear">
              <input
                id="shop-query"
                type="text"
                placeholder="search shop item"
                class="explore-input"
                oninput="updateQuery(this)"
              />
              <button
                class="explore-clear-query"
                type="button"
                aria-label="Clear search"
                onclick="clearQuery()"
                id="clear-query"
                style="display: none"
              >
                <i class="codicon codicon-close"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="explore-filters">
          <div class="explore-filter-boxes accent-red-bg">
            <p>select region</p>
            <select
              name="region"
              id="region-select"
              onchange="updateRegion(this)"
            >
              <option value="xx">World</option>
              <option value="eu">Eu</option>
              <option value="au">Au</option>
              <option value="ca">Ca</option>
              <option value="in">In</option>
              <option value="uk">Uk</option>
              <option value="us">Us</option>
            </select>
          </div>

          <div class="explore-filter-boxes accent-pink-bg">
            <p>select price range</p>
            <select
              name="price"
              id="region-price"
              onchange="updatePriceRange(this)"
            >
              <option value="all">all</option>
              <option value="100">0 - 100 🍪</option>
              <option value="500">100 - 500 🍪</option>
              <option value="1000">500 - 1000 🍪</option>
              <option value="max">>1000 🍪</option>
            </select>
          </div>

          <div class="explore-filter-boxes accent-green-bg">
            <p>sort by</p>
            <select name="sort" id="sort-by" onchange="updateSortBy(this)">
              <option value="low-high">price (low-high)</option>
              <option value="high-low">price (high-low)</option>
              <option value="alphabetical">alphabetical</option>
            </select>
          </div>

          <div class="explore-filter-boxes accent-blue-bg">
            <p>display</p>
            <select
              name="display"
              id="display-items"
              onchange="updateDisplay(this)"
            >
              <option value="all">all</option>
              <option value="affordable">all affordable</option>
              <option value="in-stock">all in stock</option>
              <option value="sale">all on sale</option>
            </select>
          </div>
        </div>
      </div>

      <div id="shop-items" class="shop-item-box shop-items-grid"></div>
    </div>

    <div id="shop-item" style="display: none">
      <div class="explore-box">
        <div class="back">
          <button class="options-button" onclick="switchMode('shop')">
            <i class="codicon codicon-arrow-left"></i>
          </button>
        </div>
        <div class="opened-shop-item-box">
          <div class="">
            <h1 id="shop-item-name" class="opened-shop-item-name">sdaf</h1>
            <img
              id="shop-item-img"
              class="opened-shop-item-image"
              src=""
              alt=""
            />
            <p id="stock" class="opened-shop-item-stock"></p>
            <p id="shop-item-desc" class="opened-shop-item-desc"></p>
            <div
              id="shop-item-desc-long"
              class="opened-shop-item-desc-left"
            ></div>
          </div>
          <div id="price-history">
            <h3>price history</h3>
            <canvas id="price-graph" class="opened-shop-item-graph"></canvas>
          </div>
          <div>
            <div id="shop-extensions" class="shop-extension">
              <div class="shop-extension-item">
                <img class="shop-extension-item-img" src="" alt="" />
                <p>black</p>
                <p>10🍪</p>
                <i class="codicon codicon-circle-large"></i>
              </div>
            </div>
            <div class="shop-price-summary-box">
              <p id="shop-price" class="opened-shop-item-price"></p>
              <div
                class="shop-price-summary-item-box"
                id="shop-price-summary"
              ></div>
              <p class="opened-shop-item-price" id="shop-final-price"></p>
            </div>
          </div>
          <a
            class="link-button center text-center project-link-button opened-shop-item-buy"
            id="open-real-shop"
            href=""
            >Buy</a
          >
        </div>
      </div>
    </div>

    <div id="user-explore" style="display: none" class="explore-box">
      <div class="explore-input-box">
        <div class="explore-query-row">
          <div class="explore-input-with-clear">
            <input
              id="user-query"
              type="text"
              placeholder="search user"
              class="explore-input"
              oninput="updateUserQuery(this)"
            />
            <button
              class="explore-clear-query"
              type="button"
              aria-label="Clear search"
              onclick="clearUserQuery()"
              id="clear-user-query"
              style="display: none"
            >
              <i class="codicon codicon-close"></i>
            </button>
          </div>
          <button type="button" class="explore-search-button" aria-label="search" onclick="">
            search
          </button>
        </div>
      </div>

      <div id="user-container" class="user-item-box user-items-grid">
        <div class="user-item">
          <img class="user-item-img" src="" alt="">
          <div class="user-item-desc">
            <h3>Joko26</h3>
            <div>
              <p>1000 🍪</p>
              <p>9h 30min 5sec</p>
            </div>
          </div>
          <button>Open</button>
        </div>
      </div>
    </div>

    <div id="user" style="display: none"></div>
    <div id="project-explore" style="display: none">
      <p>hello (proejcts)</p>
    </div>
    <div id="project" style="display: none"></div>

    <script src="${chartUri}"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    <script>
      // vars
      var userData = {};
      const vscode = acquireVsCodeApi();

      // shop
      const shopContainer = document.getElementById("shop-items");
      const goalContainer = document.getElementById("goals");

      var shopItems = {};
      var currentPrice = 0;
      var shopQuery = "";
      var region = "xx";
      var priceRange = "all";
      var sortBy = "low-high";
      var display = "all";
      var chart = null;
      var goals = [];
      var goalAmounts = {};
      var goalsHidden = false;

      // user
      var users = {};
      var userQuery = "";

      // project
      var projects = {};

      // retrive cache
      retriveCacheState();
      handleShopLoad();

      // general functions

      function setTheme(theme) {
        document.getElementById("html").className = theme;
      }

      function switchMode(mode) {
        document.getElementById("shop").style = "display: none;";
        document.getElementById("shop-item").style = "display: none;";
        document.getElementById("user-explore").style = "display: none;";
        document.getElementById("user").style = "display: none;";
        document.getElementById("project-explore").style = "display: none;";
        document.getElementById("project").style = "display: none;";
        document.getElementById("header").style = "display: none;";

        document.getElementById("display-switch-shop").className = "";
        document.getElementById("display-switch-users").className = "";
        document.getElementById("display-switch-projects").className = "";

        if (mode == "shop") {
          document.getElementById("shop").style = "display: block;";
          document.getElementById("display-switch-shop").className =
            "display-switch-selected";
          document.getElementById("header").style = "display: block;";
          handleShopLoad();
        } else if (mode == "shop-item") {
          document.getElementById("shop-item").style = "display: block;";
        } else if (mode == "user-explore") {
          document.getElementById("user-explore").style = "display: block;";
          document.getElementById("display-switch-users").className =
            "display-switch-selected";
          document.getElementById("header").style = "display: block;";
          populateUsers();
        } else if (mode == "user") {
          document.getElementById("user").style = "display: block;";
        } else if (mode == "project-explore") {
          document.getElementById("project-explore").style = "display: block;";
          document.getElementById("display-switch-projects").className =
            "display-switch-selected";
          document.getElementById("header").style = "display: block;";
          populateProjects();
        } else if (mode == "project") {
          document.getElementById("project").style = "display: block;";
        }
      }

      // cache functions
      function cacheState(state) {
        vscode.setState({ cache: state });
      }

      function retriveCacheState() {
        const state = vscode.getState();
        shopItems = state?.cache?.shopItems;
        userData = state?.cache?.userData;
        goals = state?.cache?.goals;
        goalsHidden = state?.cache?.goalsHidden;
      }

      function escapeHtml(value) {
        if (!value) return "";

        return value
          .replace(/&(?!(?:[a-zA-Z]+|#\d+|#x[a-fA-F0-9]+);)/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // credit to sabioOfficial
      function parser(text) {
        if (!text) return "";

        let html = escapeHtml(text);

        const codeBlocks = [];
        html = html.replace(
          /\`\`\`(\w*)\n([\s\S]*?)\`\`\`/g,
          function (_, language, code) {
            const id = "TOKENCODEBLOCK" + codeBlocks.length + "TOKEN";
            codeBlocks.push(
              '<pre><code class="' +
                language +
                '"><span>' +
                code.trim() +
                "</span></code></pre>",
            );
            return "\n\n" + id + "\n\n";
          },
        );

        html = html
          .replace(/^### (.*$)/gim, "<h6>$1</h6>")
          .replace(/^## (.*$)/gim, "<h5>$1</h5>")
          .replace(/^# (.*$)/gim, "<h4>$1</h4>")
          .replace(/^---$/gim, "<hr/>")
          .replace(/^\s*[-*]\s+(.*)(\n)?/gim, "<ubli>$1</ubli>")
          .replace(/^\s*\d+\.\s+(.*)(\n)?/gim, "<obli>$1</obli>")
          .replace(/^&gt;[ ]?(.*)$/gim, "<bq>$1</bq>");

        html = html
          .replace(/(<ubli>.*<\/ubli>\s*)+/g, function (m) {
            return (
              "<ul>" + m.replace(/ubli/g, "li").replace(/\n/g, "") + "</ul>"
            );
          })
          .replace(/(<obli>.*<\/obli>\s*)+/g, function (m) {
            return (
              "<ol>" + m.replace(/obli/g, "li").replace(/\n/g, "") + "</ol>"
            );
          })
          .replace(/(<bq>.*<\/bq>\s*)+/g, function (m) {
            const content = m.replace(/<\/?bq>/g, "").trim();
            return (
              "<blockquote><p>" +
              content.split("\n").join("</p><p>") +
              "</p></blockquote>"
            );
          });

        html = html
          .split(/\n\n+/)
          .map(function (block) {
            const trimmed = block.trim();
            if (
              /^<(h[1-6]|ul|ol|blockquote|pre|hr)/i.test(trimmed) ||
              trimmed.startsWith("TOKENCODEBLOCK")
            ) {
              return trimmed;
            }
            let processedBlock = trimmed.replace(/\n/g, "<br/>");
            processedBlock = processedBlock.replace(
              /(<\/h[1-6]>)\s*<br\/>/gi,
              "$1",
            );
            return "<p>" + processedBlock + "</p>";
          })
          .join("\n");

        html = html
          .replace(
            /!\[(.*?)\]\((.*?)\)/g,
            '<div class="devlog-image-wrapper"><img src="$2" alt="$1" loading="lazy" /></div>',
          )
          .replace(
            /\[(.*?)\]\((.*?)\)/g,
            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>',
          )
          .replace(/\*\*\*(.*?)\*\*\*/g, "<strong><em>$1</em></strong>")
          .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.*?)\*/g, "<em>$1</em>")
          .replace(/__(.*?)__/g, "<strong>$1</strong>")
          .replace(/_(.*?)_/g, "<em>$1</em>")
          .replace(/~~(.*?)~~/g, "<del>$1</del>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");

        codeBlocks.forEach(function (block, i) {
          html = html.replace("TOKENCODEBLOCK" + i + "TOKEN", block);
        });

        return html;
      }

      // functions for the shop page

      function handleShopLoad() {
        if (shopItems && goals && userData) {
          // cache state
          cacheState({
            shopItems: shopItems,
            userData: userData,
            goals: goals,
            goalsHidden: goalsHidden,
          });

          populateShop();
          populateGoals();
        }
      }

      function populateShop() {
        const normalizedQuery = shopQuery.trim().toLowerCase();
        const shopItemsArray = Object.values(shopItems);
        const shopItemsNameArray = shopItemsArray.map((item) => {
          return item.name;
        });

        document.getElementById("cookie-display").textContent =
          `Current Balance: ${userData.cookies ?? 0}🍪`;

        const fuse = new Fuse(shopItemsNameArray, { includeScore: true });

        // Get matching names once
        const matchingNames = new Set(
          fuse
            .search(normalizedQuery)
            .map((r) => shopItemsNameArray[r.refIndex]),
        );

        const filteredItems = shopItemsArray
          // filters all color options
          .filter((item) => {
            const price =
              item.ticket_cost?.[region] ?? item.ticket_cost?.base_cost ?? 0;
            if (price === 0) {
              return false;
            } else {
              return true;
            }
          })

          .filter((item) => {
            if (
              item.attached_shop_item_ids.length === 1 &&
              item.attached_shop_item_ids[0] === null
            ) {
              return true;
            } else {
              return false;
            }
          })

          // filters for query
          .filter((item) => {
            if (!normalizedQuery) {
              return true;
            }

            return matchingNames.has(item.name);
          })

          // filters enabled
          .filter((item) => item.enabled?.[`enabled_${region}`])

          // filters after cost
          .filter((item) => {
            const price =
              item.ticket_cost?.[region] ?? item.ticket_cost?.base_cost ?? 0;

            if (priceRange === "100") {
              return price <= 100;
            } else if (priceRange === "500") {
              return price > 100 && price <= 500;
            } else if (priceRange === "1000") {
              return price > 500 && price <= 1000;
            } else if (priceRange === "max") {
              return price > 1000;
            }

            return true;
          })

          // filters display
          .filter((item) => {
            const price =
              item.ticket_cost?.[region] ?? item.ticket_cost?.base_cost ?? 0;

            if (display === "all") {
              return true;
            }

            if (display === "affordable") {
              if (price <= (userData.cookies ?? 0)) {
                return true;
              } else {
                return false;
              }
            }

            if (display === "in-stock") {
              if ((item.stock ?? 0) >= 1 || !item.limited) {
                return true;
              } else {
                return false;
              }
            }

            if (display === "sale") {
              if (
                Number.isFinite(Number(item.sale_percentage)) &&
                item.sale_percentage > 0
              ) {
                return true;
              } else {
                return false;
              }
            } else {
              return true;
            }

            return false;
          });

        // sort
        filteredItems.sort((leftItem, rightItem) => {
          const leftPrice =
            leftItem.ticket_cost?.[region] ??
            leftItem.ticket_cost?.base_cost ??
            0;
          const rightPrice =
            rightItem.ticket_cost?.[region] ??
            rightItem.ticket_cost?.base_cost ??
            0;

          if (sortBy === "high-low") {
            return rightPrice - leftPrice;
          }

          if (sortBy === "alphabetical") {
            return leftItem.name.localeCompare(rightItem.name);
          }

          return leftPrice - rightPrice;
        });

        // render
        shopContainer.innerHTML = filteredItems
          .map((item) => {
            const price =
              item.ticket_cost?.[region] ?? item.ticket_cost?.base_cost;

            var sale = "";
            if (
              Number.isFinite(item.sale_percentage) &&
              item.sale_percentage > 0
            ) {
              sale = `<p class="warning-bg shop-badge">${item.sale_percentage}% sale</p>`;
            }

            var stock = "";
            const stockValue = Number(item.stock);
            if (
              Number.isFinite(stockValue) &&
              stockValue <= 30 &&
              item.limited
            ) {
              if (stockValue >= 16) {
                stock = `<p class="accent-green-bg shop-badge">${stockValue} left</p>`;
              } else if (stockValue >= 9) {
                stock = `<p class="accent-red-bg shop-badge">${stockValue} left</p>`;
              } else {
                stock = `<p class="accent-pink-bg shop-badge">${stockValue} left</p>`;
              }
            }

            var goal = `<button id='favourite-${item.id}' class="favourite" onclick="handleAddGoal('${item.id}')"><i id='favourite-icon-${item.id}' class="codicon codicon-star-empty"></i></button>`;
            if (goals.includes(Number(item.id))) {
              goal = `<button id='favourite-${item.id}' class="favourite-active favourite" onclick="handleAddGoal('${item.id}')"><i id='favourite-icon-${item.id}' class="codicon codicon-star-full"></i></button>`;
            }

            return `
          <div class="shop-item">
          <div class="shop-badge-top-right">
            ${goal}
          </div>
          <div class="shop-badge-top-left">
            ${sale}
            ${stock}
          </div>
          <img
            class="shop-item-img"
            src="${item.image_url}"
            alt="shop item image"
          />
          <div class="shop-item-desc">
            <h2>${item.name}</h2>
            <p>${price} 🍪 (~${price / 10}hr)</p>
          </div>
          <button onclick="openShopItem('${item.id}')">Buy</button>
        </div>`;
          })
          .join("");
      }

      function normalizePriceHistory(oldPrices) {
        if (!Array.isArray(oldPrices)) {
          return [];
        }

        return oldPrices
          .map((entry) => {
            if (typeof entry === "number") {
              return entry;
            }

            if (typeof entry === "string") {
              const parsed = Number(entry);
              return Number.isFinite(parsed) ? parsed : null;
            }

            if (entry && typeof entry === "object") {
              const candidate = entry.base_cost;
              const parsed = Number(candidate);
              return Number.isFinite(parsed) ? parsed : null;
            }

            return null;
          })
          .filter((price) => Number.isFinite(price));
      }

      function openShopItem(id) {
        // vars
        const shopItem = shopItems[id];
        const shopItemsArray = Object.values(shopItems);

        const itemPrice =
          shopItem.ticket_cost?.[region] ??
          shopItem.ticket_cost?.base_cost ??
          0;

        if (chart !== null) {
          chart.destroy();
          chart = null;
        }

        const extensions = shopItemsArray.filter((item) => {
          if (item.attached_shop_item_ids.includes(shopItem.id)) {
            return true;
          } else {
            return false;
          }
        });

        currentPrice = Number(itemPrice);

        if (!Number.isFinite(currentPrice)) {
          currentPrice = 0;
        }

        const history = [
          ...normalizePriceHistory(shopItem.old_prices),
          ...(Number.isFinite(currentPrice) ? [currentPrice] : []),
        ];

        var buyButtonText = "";
        const cookies = Number(userData.cookies);
        const remaining = cookies - currentPrice;

        if (remaining >= 0) {
          buyButtonText = `Buy (${remaining}🍪 remaining)`;
        } else {
          buyButtonText = `Buy (${Math.abs(remaining)}🍪 more cookies needed)`;
        }

        // make previosly hidden elements visble
        document.getElementById("stock").style = "display: block";
        document.getElementById("price-history").style = "display: block";

        // fill all fields
        document.getElementById("shop-item-name").textContent = shopItem.name;
        document.getElementById("shop-item-img").src = shopItem.image_url;
        document.getElementById("shop-item-desc").textContent =
          shopItem.description;
        document.getElementById("shop-final-price").textContent =
          `Final price: ${currentPrice}🍪`;
        document.getElementById("shop-price").textContent =
          `Base price for selected region: ${itemPrice}🍪`;
        document.getElementById("open-real-shop").href =
          `https://flavortown.hackclub.com/shop/order?shop_item_id=${shopItem.id}`;
        document.getElementById("open-real-shop").textContent = buyButtonText;

        document.getElementById("shop-item-desc-long").innerHTML = "";
        parser(shopItem.long_description || "")
          .split("\n")
          .forEach((line) => {
            document.getElementById("shop-item-desc-long").innerHTML +=
              `${line}<br>`;
          });

        // render stock
        if (!shopItem.limited) {
          document.getElementById("stock").style = "display: none";
        } else {
          document.getElementById("stock").textContent =
            `${shopItem.stock} left`;
        }

        // render chart if price history
        if (typeof Chart === "undefined") {
          document
            .getElementById("shop-price")
            .insertAdjacentHTML(
              "beforeend",
              "<p>Chart library was not loaded.</p>",
            );
        } else if (history.length >= 2) {
          const labels = history.map((_, index) => `P${index + 1}`);
          chart = new Chart(document.getElementById("price-graph"), {
            type: "line",
            data: {
              labels,
              datasets: [
                {
                  label: "Prices",
                  data: history,
                },
              ],
            },
          });
        } else {
          document.getElementById("price-history").style = "display: none";
        }

        // render extensions
        document.getElementById("shop-extensions").innerHTML = extensions
          .map((extension) => {
            return `
              <div onclick="updateExtension('${extension.id}', '${extension.ticket_cost.base_cost}', '${id}')" id="extension-container${extension.id}" class="shop-extension-item">
                <img class="shop-extension-item-img" src="${extension.image_url}" alt="">
                <p >${extension.name}</p>
                <p>${extension.ticket_cost.base_cost}🍪</p>
                <i id="extension-circle${extension.id}" class="codicon codicon-circle-large"></i>
              </div>`;
          })
          .join("");

        // switch to page
        switchMode("shop-item");
      }

      function updateRegion(event) {
        region = event.value;
        populateShop();
      }

      function updatePriceRange(event) {
        priceRange = event.value;
        populateShop();
      }

      function updateSortBy(event) {
        sortBy = event.value;
        populateShop();
      }

      function updateDisplay(event) {
        display = event.value;
        populateShop();
      }

      function updateQuery(event) {
        shopQuery = event.value;
        populateShop();
        if (event.value !== "") {
          document.getElementById("clear-query").style = "display: block;";
        } else {
          document.getElementById("clear-query").style = "display: none;";
        }
      }

      function clearQuery() {
        const input = document.getElementById("shop-query");
        if (!input) {
          return;
        }

        input.value = "";
        shopQuery = "";
        populateShop();
        document.getElementById("clear-query").style = "display: none;";
      }

      function updateExtension(id, price, itemId) {
        const container = document.getElementById(`extension-container${id}`);
        const circle = document.getElementById(`extension-circle${id}`);
        const extensionPrice = Number(price);

        if (!container || !circle || !Number.isFinite(extensionPrice)) {
          return;
        }

        var buyButtonText = "";

        const isActive = container.classList.contains(
          "shop-extension-item-active",
        );

        const itemPrice =
          shopItems[itemId].ticket_cost?.[region] ??
          shopItems[itemId].ticket_cost?.base_cost ??
          0;

        const priceSummaryElement = document.createElement("p");
        priceSummaryElement.id = `price-summary-${id}`;
        priceSummaryElement.textContent = `    + ${shopItems[id].name} (${price}🍪)`;

        const cookies = Number(userData.cookies);
        const remaining = cookies - currentPrice;

        // update price and summary elemets
        if (isActive) {
          currentPrice -= extensionPrice;
          document
            .getElementById("shop-price-summary")
            .removeChild(document.getElementById(`price-summary-${id}`));
        } else {
          currentPrice += extensionPrice;
          document
            .getElementById("shop-price-summary")
            .appendChild(priceSummaryElement);
        }

        if (remaining >= 0) {
          buyButtonText = `Buy (${remaining}🍪 remaining)`;
        } else {
          buyButtonText = `Buy (${Math.abs(remaining)}🍪 more cookies needed)`;
        }

        // update all fields
        container.classList.toggle("shop-extension-item-active", !isActive);
        circle.classList.toggle("codicon-circle-large-filled", !isActive);
        circle.classList.toggle("codicon-circle-large", isActive);

        document.getElementById("shop-price").textContent =
          `Base price for selected region: ${itemPrice}🍪`;

        document.getElementById("shop-final-price").textContent =
          `Final price: ${currentPrice}🍪`;

        document.getElementById("open-real-shop").textContent = buyButtonText;
      }

      function populateGoals() {
        const uniqueGoals = [
          ...new Set(goals.map((goal) => Number(goal))),
        ].filter((goal) => Number.isFinite(goal));

        goalContainer.innerHTML = uniqueGoals
          .map((goal) => {
            if (shopItems[goal]) {
              const amount = goals.filter(
                (item) => Number(item) === goal,
              ).length;

              goalAmounts[goal] = amount;

              const item = shopItems[goal];
              const price =
                item.ticket_cost?.[region] ?? item.ticket_cost?.base_cost ?? 0;

              var down = "";
              if (amount === 1) {
                down = `<button id="down-${goal}" onclick="decreaseGoalAmount('${goal}')" style="display: none" class="goal-amount-button"><i class="codicon codicon-triangle-down"></i></button>`;
              } else {
                down = `<button id="down-${goal}" onclick="decreaseGoalAmount('${goal}')" style="display: block" class="goal-amount-button"><i class="codicon codicon-triangle-down"></i></button>`;
              }

              var goalPrice = "";
              if (price <= (userData?.cookies ?? 0) * amount) {
                goalPrice = `<p>${price * amount}🍪 ✅</p>`;
              } else {
                goalPrice = `<p>${userData.cookies}🍪/${price * amount}🍪</p>`;
              }

              return `
            <div class="goal-item"">
            <img class="goal-item-img" src="${item.image_url}" alt="" onclick="openShopItem(${goal})">
            <div class="goal-item-desc"  onclick="openShopItem(${goal})">
              <p>${item.name}</p>
              ${goalPrice}
            </div>
            <div class="goal-amount">
              <button id="up-${goal}" onclick="increaseGoalAmount('${goal}')" class="goal-amount-button"><i class="codicon codicon-triangle-up"></i></button>
              <p>${amount}</p>
              ${down}
            </div>
            <button class="goal-delete-button" onclick='deleteGoal(${goal})'><i class="codicon codicon-trash"></i></button>
          </div>`;
            }
          })
          .join("");
      }

      function toggleGoals() {
        if (goalsHidden) {
          goalContainer.style.display = "";
          goalsHidden = !goalsHidden;
        } else {
          goalContainer.style.display = "none";
          goalsHidden = !goalsHidden;
        }
      }

      function handleAddGoal(id) {
        const goalId = Number(id);

        if (!Number.isFinite(goalId)) {
          return;
        }

        if (goals.includes(goalId)) {
          goals = goals.filter((goal) => Number(goal) !== goalId);
          document.getElementById(`favourite-${id}`).className = "favourite";
          document.getElementById(`favourite-icon-${id}`).className =
            "codicon codicon-star-empty";
        } else {
          goals.push(goalId);
          document.getElementById(`favourite-${id}`).className =
            "favourite-active favourite";
          document.getElementById(`favourite-icon-${id}`).className =
            "codicon codicon-star-full";
        }

        syncGoalsState();
      }

      function deleteGoal(id) {
        const goalId = Number(id);

        if (!Number.isFinite(goalId)) {
          return;
        }

        goals = goals.filter((goal) => Number(goal) !== goalId);
        syncGoalsState();
      }

      function removeLastGoalOccurrence(goal) {
        const goalId = Number(goal);

        if (!Number.isFinite(goalId)) {
          return false;
        }

        const indexFromEnd = [...goals]
          .reverse()
          .findIndex((g) => Number(g) === goalId);

        if (indexFromEnd === -1) {
          return false;
        }

        const index = goals.length - 1 - indexFromEnd;
        goals.splice(index, 1);
        return true;
      }

      function syncGoalsState() {
        vscode.postMessage({ command: "post-goals", value: goals });
        handleShopLoad();
      }

      // increase goal ammount
      function increaseGoalAmount(id) {
        const goalId = Number(id);

        if (!Number.isFinite(goalId)) {
          return;
        }

        const amount = goalAmounts[goalId] ?? 0;
        if (amount >= 100) {
          return;
        }

        goals.push(goalId);
        syncGoalsState();
      }

      // decrease goal amount
      function decreaseGoalAmount(id) {
        const goalId = Number(id);

        if (!Number.isFinite(goalId)) {
          return;
        }

        const amount = goalAmounts[goalId] ?? 0;
        if (amount <= 1) {
          return;
        }

        if (removeLastGoalOccurrence(goalId)) {
          syncGoalsState();
        }
      }

      // functions for the user page

      function populateUsers() {

      }

      function openUser(id) {
        switchMode("user");
      }

      function clearUserQuery() {
        userQuery = "";
        const inputEl = document.getElementById("user-query");
        inputEl.value = userQuery;
        document.getElementById("clear-user-query").style.display = "none";
      }

      function updateUserQuery(inputEl) {
        userQuery = inputEl.value;

        if (userQuery !== "") {
          document.getElementById("clear-user-query").style.display = "inline-flex";
        } else {
          document.getElementById("clear-user-query").style.display = "none";
        }
      }

      function searchProject() {
        if (userQuery || userQuery !== "") {
          vscode.postMessage({command: "search-user", value:userQuery})
        }
      }

      // functions for the project page

      function populateProjects() {}

      function openProject(id) {
        switchMode("project");
      }

      // listen for messages from the extension
      window.addEventListener("message", (event) => {
        const message = event.data;
        switch (message.command) {
          case "set-theme": {
            setTheme(message.value);
            break;
          }
          case "storeItems": {
            shopItems = message.value;
            handleShopLoad();
            break;
          }
          case "users": {
            users = message.value;
            break;
          }
          case "projects": {
            projects = message.value;
            break;
          }
          case "user-data": {
            userData = message.value;
            handleShopLoad();
            break;
          }
          case "goals": {
            goals = message.value;
            handleShopLoad();
            break;
          }
        }
      });
    </script>
  </body>
</html>
