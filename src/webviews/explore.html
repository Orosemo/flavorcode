<!doctype html>
<html lang="en" id="html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Devlog</title>
    <link rel="stylesheet" href="${styleUri}" />
    <link rel="stylesheet" href="${codiconUri}" />
  </head>
  <body>
    <div id="header" class="explore-header">
      <h1>Explore</h1>
      <div class="display-switch-container">
        <button
          id="display-switch-shop"
          class="display-switch-selected"
          onclick="switchMode('shop')"
        >
          Shop
        </button>
        <button
          id="display-switch-users"
          class=""
          onclick="switchMode('user-explore')"
        >
          Users
        </button>
        <button
          id="display-switch-projects"
          class=""
          onclick="switchMode('project-explore')"
        >
          Projects
        </button>
      </div>
    </div>

    <div id="shop" class="explore-shop">
      <div>
        <input type="text" placeholder="search shop item" />

        <select name="region" id="region-select">
          <option value="eu">Eu</option>
          <option value="au">Au</option>
          <option value="ca">Ca</option>
          <option value="in">In</option>
          <option value="uk">Uk</option>
          <option value="us">Us</option>
          <option value="xx">World</option>
        </select>

        <select name="price" id="region-price">
          <option value="max">my balance</option>
          <option value="100">0 - 100 🍪</option>
          <option value="100">100 - 500 🍪</option>
          <option value="100">500 - 1000 🍪</option>
          <option value="100">>1000 🍪</option>
        </select>

        <div>
          <input type="checkbox">   
          <p>Show out of Stock items</p>
        </div>
        

      </div>
    </div>
    <div id="shop-item" style="display: none"></div>
    <div id="user-explore" style="display: none">
      <p>hello (users)</p>
    </div>
    <div id="user" style="display: none"></div>
    <div id="project-explore" style="display: none">
      <p>hello (proejcts)</p>
    </div>
    <div id="project" style="display: none"></div>

    <script>
      // vars
      var userData = {};

      // shop
      var shopItems = {};

      // user
      var users = {};

      // project
      var projects = {};

      // general functions

      function setTheme(theme) {
        document.getElementById("html").className = theme;
      }

      function switchMode(mode) {
        document.getElementById("shop").style = "display: none;";
        document.getElementById("shop-item").style = "display: none;";
        document.getElementById("user-explore").style = "display: none;";
        document.getElementById("user").style = "display: none;";
        document.getElementById("project-explore").style = "display: none;";
        document.getElementById("project").style = "display: none;";
        document.getElementById("header").style = "display: none;";

        document.getElementById("display-switch-shop").className = "";
        document.getElementById("display-switch-users").className = "";
        document.getElementById("display-switch-projects").className = "";

        if (mode == "shop") {
          document.getElementById("shop").style = "display: block;";
          document.getElementById("display-switch-shop").className =
            "display-switch-selected";
          document.getElementById("header").style = "display: block;";
        } else if (mode == "shop-item") {
          document.getElementById("shop-item").style = "display: block;";
        } else if (mode == "user-explore") {
          document.getElementById("user-explore").style = "display: block;";
          document.getElementById("display-switch-users").className =
            "display-switch-selected";
          document.getElementById("header").style = "display: block;";
        } else if (mode == "user") {
          document.getElementById("user").style = "display: block;";
        } else if (mode == "project-explore") {
          document.getElementById("project-explore").style = "display: block;";
          document.getElementById("display-switch-projects").className =
            "display-switch-selected";
          document.getElementById("header").style = "display: block;";
        } else if (mode == "project") {
          document.getElementById("project").style = "display: block;";
        }
      }

      // functions for the shop page

      function populateShop() {}

      function openShopItem(id) {
        switchMode("shop-item");
      }

      // functions for the user page

      function populateUsers() {}

      function openUser(id) {
        switchMode("user");
      }

      // listen for messages from the extension
      window.addEventListener("message", (event) => {
        const message = event.data;
        switch (message.command) {
          case "set-theme": {
            setTheme(message.value);
            break;
          }
          case "projects": {
            shopItems = message.value;
            break;
          }
          case "users": {
            users = message.value;
            break;
          }
          case "storeItems": {
            projects = message.value;
            break;
          }
        }
      });

      // functions for the project page

      function populateProjects() {}

      function openProject(id) {
        switchMode("project");
      }

      // listens for messages from the extentsion
      window.addEventListener("message", (event) => {
        const message = event.data;

        switch (message.command) {
          case "set-theme": {
            setTheme(message.value);
            break;
          }
          case "storeItems": {
            shopItems = message;
            populateShop();
          }
          case "projects": {
            projects = message;
            populateProjects();
          }
          case "users": {
            projects = message;
            populateUsers();
          }
          case "user-data": {
            userData = message;
          }
        }
      });
    </script>
  </body>
</html>
